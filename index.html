<style>
:root {
  --bg: #0f172a; --bg2: #1e293b;
  --panel: rgba(30, 41, 59, 0.7); --panel2: rgba(15, 23, 42, 0.8); --panel3: rgba(51, 65, 85, 0.6);
  --line: rgba(255, 255, 255, 0.1); --text: #f8fafc; --muted: #94a3b8;
  --green: #10b981; --green2: #34d399; --blue: #38bdf8; --indigo: #6366f1;
  --red: #f43f5e; --amber: #f59e0b;
  --radius: 20px;
  --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  --glow-primary: 0 0 15px rgba(16, 185, 129, 0.5);
  --glow-blue: 0 0 15px rgba(56, 189, 248, 0.5);
  --blue-rgb: 56,189,248;
}
body.light {
  --bg: #f8fafc; --bg2: #e2e8f0;
  --panel: rgba(255, 255, 255, 0.85); --panel2: rgba(248, 250, 252, 0.9); --panel3: rgba(241, 245, 249, 0.8);
  --line: #cbd5e1; --text: #0f172a; --muted: #64748b;
  --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  --glow-primary: 0 8px 15px rgba(16, 185, 129, 0.2);
  --glow-blue: 0 8px 15px rgba(56, 189, 248, 0.2);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; font-family: 'Inter', system-ui, sans-serif;
  background: radial-gradient(circle at 50% 0%, var(--bg2) 0%, var(--bg) 80%);
  color: var(--text); font-size: 14.5px; padding-bottom: calc(150px + env(safe-area-inset-bottom)); min-height: 100vh;
}
.top {
  position: sticky; top: 0; z-index: 30;
  background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line); padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
body.light .top { background: rgba(255, 255, 255, 0.85); }
.top-brand { display: flex; align-items: center; gap: 11px; }
.logo {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(135deg, #10b981, #059669); color: #fff;
  display: grid; place-items: center; font-weight: 900; font-size: 13px;
  box-shadow: var(--glow-primary); border: 1px solid rgba(255,255,255,0.2);
}
.top-title h1 { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: -0.3px; background: linear-gradient(to right, var(--blue), #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.top-title small { color: var(--muted); font-size: 11.5px; display: block; font-weight: 600; }
.wrap { max-width: 860px; margin: auto; padding: 16px 16px calc(170px + env(safe-area-inset-bottom)); min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.card {
  background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; margin: 0 0 16px; box-shadow: var(--shadow); transition: transform 0.2s;
}
.card h3 { margin: 0 0 14px; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat {
  background: var(--panel3); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 8px; text-align: center; min-width: 0; overflow: hidden; transition: all 0.3s ease;
}
.stat:hover { border-color: var(--blue); transform: translateY(-3px); box-shadow: var(--glow-blue); }
.stat b { display: block; font-size: 24px; font-weight: 900; margin: 4px 0 2px; color: var(--blue); }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800; }
.stats .stat { min-height:132px; box-sizing:border-box; overflow:hidden; padding-top:10px; padding-bottom:8px; }
.stat .sl { display:flex; justify-content:space-between; gap:5px; font-size:9.5px; line-height:1.4; margin-top:1px; text-align:left; color:var(--text); }
.stat .sl i { font-style:normal; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stat .sl u { text-decoration:none; flex:none; font-weight:800; color:var(--green2); }
.stat .sl.g i { color:var(--green2); font-weight:700; }
.stat .sub { display:block; margin-top:3px; padding-top:3px; border-top:1px dashed var(--line); }
.stat em { font-style: normal; color: var(--green2); font-size: 11.5px; font-weight: 600; }

.btn {
  border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; background: var(--panel3);
  color: var(--text); font-weight: 700; font-size: 14px; cursor: pointer; min-height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.25s ease;
}
.btn:active { transform: scale(0.96); }
.btn:hover { background: rgba(255,255,255,0.05); }
.btn.primary { background: linear-gradient(135deg, #10b981, #059669); color: #fff; border-color: #34d399; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
.btn.primary:hover { box-shadow: var(--glow-primary); transform: translateY(-2px); }
.btn.blue { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: #fff; border-color: #7dd3fc; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); }
.btn.blue:hover { box-shadow: var(--glow-blue); transform: translateY(-2px); }
.btn.amber { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; border-color: #fbbf24; }
.btn.danger { background: rgba(244, 63, 94, 0.15); color: #fb7185; border-color: rgba(244, 63, 94, 0.4); }
body.light .btn.danger { color: #e11d48; }
.btn.smallbtn { min-height: 34px; padding: 6px 12px; font-size: 12px; border-radius: 10px; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
.field input, .field select, .field textarea {
  width: 100%; min-width: 0; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--line);
  border-radius: 12px; color: var(--text); padding: 12px 14px; font: inherit; outline: none; transition: all 0.2s ease;
}
body.light .field input, body.light .field select, body.light .field textarea { background: #fff; }
.field textarea { min-height: 70px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green2); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); background: rgba(0,0,0,0.4); }
.row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; min-width: 0; } .row > * { min-width: 0; }
.hidden { display: none !important; }

.nav {
  position: fixed; z-index: 35; bottom: 0; left: 0; right: 0;
  background: rgba(15, 23, 42, 0.85); border-top: 1px solid var(--line); backdrop-filter: blur(20px);
  display: flex; justify-content: space-around; padding: 8px 4px calc(10px + env(safe-area-inset-bottom));
  max-width: 860px; margin: auto;
}
body.light .nav { background: rgba(255, 255, 255, 0.9); }
.nav button {
  background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 700;
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; min-width: 0; flex: 1; cursor: pointer; transition: all 0.2s;
}
.nav button strong { font-size: 20px; line-height: 1.1; transition: transform 0.2s; }
.nav button.active { color: var(--green2); }
body.light .nav button.active { color: #059669; }
.nav button.active strong { transform: translateY(-3px); filter: drop-shadow(0 0 8px rgba(16,185,129,0.6)); }

.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 999px;
  background: rgba(16, 185, 129, 0.15); color: #34d399; font-size: 11.5px; font-weight: 800; border: 1px solid rgba(16, 185, 129, 0.3);
}
body.light .pill { color: #047857; }
.pill.amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }
body.light .pill.amber { color: #b45309; }
.pill.red { background: rgba(244, 63, 94, 0.15); color: #fb7185; border-color: rgba(244, 63, 94, 0.3); }
body.light .pill.red { color: #e11d48; }
.pill.blue { background: rgba(var(--blue-rgb), 0.15); color: #7dd3fc; border-color: rgba(var(--blue-rgb), 0.3); }
body.light .pill.blue { color: #0284c7; }

.item { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line); padding: 14px 0; }
.item:last-child { border-bottom: 0; }
.item strong { display: block; font-size: 15px; margin-bottom: 4px; color: var(--text); }
.item small { color: var(--muted); line-height: 1.5; display: block; }
.item .right { text-align: right; flex-shrink: 0; }

.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0; }
.dayhead { text-align: center; color: var(--muted); font-size: 11px; font-weight: 800; padding: 6px 0; }
.day {
  min-height: 62px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel2);
  padding: 8px 4px; text-align: center; color: var(--text); font-size: 13px; font-weight: 800; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; transition: all 0.2s;
}
.day:hover { transform: scale(1.05); }
.day.marked { background: rgba(16, 185, 129, 0.2); border-color: #10b981; }
.day.ot { background: rgba(var(--blue-rgb), 0.2); border-color: #38bdf8; }
.day.half { background: rgba(245, 158, 11, 0.2); border-color: #f59e0b; }
.day.absent { background: rgba(244, 63, 94, 0.2); border-color: #f43f5e; }
.day.holiday { background: rgba(168, 85, 247, 0.2); border-color: #a855f7; }
.day .tag { display: block; font-size: 10px; padding: 3px 5px; border-radius: 6px; background: rgba(0, 0, 0, 0.3); color: var(--text); max-width: 95%; overflow: hidden; text-overflow: ellipsis; }
.day.today { outline: 2px solid var(--blue); box-shadow: var(--glow-blue); }

.toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 100;
  background: rgba(6, 78, 59, 0.95); border: 1px solid #10b981; color: #ecfdf5;
  padding: 12px 20px; border-radius: 99px; font-weight: 800; font-size: 14px;
  display: none; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); max-width: 92%; text-align: center; animation: slideDown 0.3s ease;
}
@keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

.empty { color: var(--muted); text-align: center; padding: 26px 14px; font-size: 14px; font-weight: 600; }
.section-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.section-title h3 { margin: 0; }
.search { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-radius: 14px; color: var(--text); padding: 13px 16px; margin-bottom: 14px; font: inherit; outline: none; transition: all 0.2s; }
.search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(var(--blue-rgb),0.15); }
.checkrow { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 13.5px; padding: 10px 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: all 0.2s; font-weight: 600; }
.checkrow:hover { background: rgba(255,255,255,0.06); }
.checkrow input { accent-color: var(--green); width: 18px; height: 18px; cursor: pointer; }
.stage-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
.stage-chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 800; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
.chip.active { background: linear-gradient(135deg, #10b981, #059669); color: #fff; border-color: #34d399; box-shadow: 0 4px 10px rgba(16,185,129,0.3); }
.stage-box { background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.stage-box h4 { margin: 0 0 12px; font-size: 14px; color: var(--blue); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; }
.quick-link { color: var(--green2); font-size: 11.5px; cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; font-weight: 800; }
.modal-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(2, 8, 23, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn 0.2s ease; }
.record-modal { width: min(740px, 100%); max-height: 88vh; overflow: auto; margin: 0; box-shadow: 0 25px 80px rgba(0, 0, 0, 0.7); }


#pinLockOverlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress-bar-fill { height: 100%; background: linear-gradient(to right, var(--blue), var(--green2)); transition: width 0.3s; }
.split-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; padding-bottom: 12px; border-bottom: 1px dashed var(--line); margin-bottom: 12px; }
.split-row .field { margin-bottom: 0; }


.tgl{display:inline-flex;align-items:center;gap:8px;margin:0;padding:4px;cursor:pointer;flex:none;text-transform:none}
.tgl input{width:20px;height:20px;margin:0;accent-color:var(--green2);cursor:pointer;flex:none}
.skipd .tgt{opacity:.5;text-decoration:line-through}
#workForm .stage-box h4.tg-h{justify-content:flex-start;gap:6px}
#workForm .stage-box{padding:10px 12px;margin-bottom:10px;border-radius:12px}
#workForm .stage-box h4{margin-bottom:8px;font-size:13px}
#workForm .field{margin-bottom:8px}
#workForm .field input,#workForm .field select{padding:8px 10px;font-size:14px;min-height:0}
#workForm .split-row{gap:6px;padding-bottom:8px;margin-bottom:8px}
#workForm .checkrow{padding:6px 10px;font-size:12.5px;border-radius:10px}
#workForm .checkrow input{width:16px;height:16px}
#workForm .smallbtn{padding:5px 9px;font-size:12px} #workForm .repair-part-row{position:relative} #workForm .repair-part-row > [data-repair-custom]{grid-column:1 / -1} #workForm{padding-bottom:80px;min-width:0} #workForm .actions{min-width:0} #workForm .actions .btn{min-width:0;max-width:100%;white-space:normal}

  .mu { color: #64748b; } .nw { white-space: nowrap; } .rt { text-align: right; }

  .bd { padding: 3px 11px; border-radius: 99px; font-weight: 800; font-size: 9.5px; letter-spacing: .6px; white-space: nowrap; } .bd.g { color: #047857; background: #d1fae5; } .bd.r { color: #be123c; background: #ffe4e6; }
  .inf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 12px; margin-bottom: 8px; } .inf i { display: block; font-style: normal; font-size: 9px; color: #475569; text-transform: uppercase; } .inf b { font-size: 11px; }

  body #printContainer:not(:has(.nb)) { box-sizing: border-box; width: 100%; max-width: 100%; border: 1.5px solid #111111; border-radius: 6px; padding: 24px; -webkit-box-decoration-break: clone; box-decoration-break: clone; overflow: hidden; }

}

.item.wc { flex-direction: column; align-items: stretch; gap: 10px; border-left: 3px solid var(--red); padding-left: 12px; }
.item.wc.ok { border-left-color: var(--green); }

.wc-g { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 13px; }

.qchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  WORK_REQ.forEach(([k, l]) => {
    let v = String(o[k] ?? '').trim();
    if (k === 'orderNo' || k === 'subOrder') v = normT(v);
    if (k === 'qty' && !(Number(v) > 0)) v = '';
    if (!v) add('Missing: ' + l, wf.elements[k]);
  });
  const on = String(o.orderNo || '').trim(), sb = String(o.subOrder || '').trim().replace(/\u2206+$/, '');
  if (normT(on) && normT(sb)) {
    const pre = on.toLowerCase() + '/', rest = sb.toLowerCase().startsWith(pre) ? sb.slice(pre.length) : null;
    if (rest === null || !/^\d{1,2}$/.test(rest)) add('Invalid Sub Order format (correct: ' + on + '/1)', wf.elements.subOrder);
  }
  if (itemDupFind(o.orderNo, o.itemCode, workEditId)) add('Duplicate Item Code in this TAE', wf.elements.itemCode);
  const total = Number(o.qty || 0);
  STAGES.forEach(([k, l]) => {
    if (wf.elements[NO_STAGE[k]]?.checked) return;
    const sp = getSplitsFromDOM(k), done = sp.reduce((t, p) => t + p.done, 0), box = document.getElementById('splits-' + k);
    if (!sp.length) add(l + ': no contractor / quantity added', box);
    else if (done < total) add(l + ': only ' + done + ' of ' + total + ' pcs completed', box);
  });
  const hw = [...HWK, 'fitCustomHardwareEnabled'].some(k => wf.elements[k]?.checked);
  if (!hw && !wf.elements.noHardware?.checked) add('Hardware Checklist: select items or "No Hardware Attached"', document.getElementById('hwBox'));
  if (wf.elements.needsRepair?.checked) { if (!wf.elements.fitRepairReceiveDate?.value) add('Repairing: Return Receive Date missing', wf.elements.fitRepairReceiveDate); }
  else if (!wf.elements.noRepair?.checked && !lhAllOn(wf)) add('Repairing: select "No Repairing Pending" or send a part to repairing', document.getElementById('repToggle'));
  const pk = getPackFromDOM(), pkSent = pk.reduce((t, p) => t + p.qty, 0), pkBox = document.getElementById('splits-packing');
  if (wf.elements.noPacking?.checked) {   }
  else if (pk.length) {
    if (pkSent < total) add('Packing Hall: only ' + pkSent + ' of ' + total + ' pcs sent', pkBox);
    if (pk.some(p => !p.date)) add('Packing Hall: date missing in a row', pkBox);
  } else if (!String(o.packingDate || '').trim()) add('Fitting to Packing Hall Date missing', wf.elements.packingDate);
  QC_ITEMS.forEach(([k, l]) => { if (!qcOkIn(wf, k)) add('Quality Check: ' + l + ' not ticked', wf.elements[k]?.closest('.checkrow')); });
  formNameErrors(wf, false).forEach(n => add('Unregistered name: ' + n.m, n.el));
  return out;
}

function validateWorkForm(wf, o) {
  wf.querySelectorAll('.inv').forEach(el => el.classList.remove('inv'));
  const bad = [], msgs = [];
  WORK_REQ.forEach(([k, label]) => {
    let v = String(o[k] ?? '').trim();
    if (k === 'orderNo' || k === 'subOrder') v = normT(v);
    if (k === 'qty' && !(Number(v) > 0)) v = '';
    if (!v) { bad.push(k); msgs.push(label); }
  });
  const orderNo = String(o.orderNo || '').trim(), sub = String(o.subOrder || '').trim().replace(/\u2206+$/, '');
  let subMsg = '';
  if (!bad.includes('subOrder') && !bad.includes('orderNo')) {
    const pre = orderNo.toLowerCase() + '/';
    const rest = sub.toLowerCase().startsWith(pre) ? sub.slice(pre.length) : null;
    if (rest === null || !/^\d{1,2}$/.test(rest)) {
      bad.push('subOrder');
      subMsg = `Invalid Sub Order (${sub}). Please correct it: ${orderNo}/1 or ${orderNo}/12 (a 1 or 2 digit number is required at the end)`;
    }
  }
  const nameErr = formNameErrors(wf);
  const box = document.getElementById('workFormError');
  if (!bad.length && !nameErr.length) { if (box) { box.innerHTML = ''; box.classList.add('hidden'); } return true; }
  bad.forEach(k => wf.elements[k]?.classList.add('inv'));
  let html = '';
  if (msgs.length) html += `❌ Entry missing: ${msgs.map(esc).join(', ')}. All fields are required.`;
  if (subMsg) html += (html ? '<br>' : '') + '❌ ' + esc(subMsg);
  if (nameErr.length) html += (html ? '<br>' : '') + '❌ Only registered names or codes are allowed (Settings → Names & Custom Codes):<br>' + nameErr.map(n => '• ' + esc(n.m)).join('<br>');
  if (box) { box.innerHTML = html; box.classList.remove('hidden'); box.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  toast(msgs.length ? 'Entry missing: ' + msgs[0] + (msgs.length > 1 ? ' +' + (msgs.length - 1) + ' more' : '') : subMsg ? 'Please correct the Sub Order' : 'Unregistered name: ' + nameErr[0].m);
  (bad.length ? wf.elements[bad[0]] : nameErr[0].el)?.focus({ preventScroll: true });
  return false;
}

function bindWorkFormEvents() {
  const f = document.getElementById('workForm'); if (!f) return;
  if (!workEditId && !f.querySelector('.split-row')) { ['sanding', 'polish', 'carpenter'].forEach(k => addSplitRow(k)); document.getElementById('splits-fitting').innerHTML = splitRowHtml('fitting', 'Chandaram', '', '0', ''); }
  ['orderNo','itemCode','subOrder'].forEach(n => f.elements[n]?.addEventListener('input', () => checkSubOrderDuplicate(false)));
  ['orderNo','itemCode'].forEach(n => f.elements[n]?.addEventListener('input', () => checkItemCodeDuplicate(false)));
  f.addEventListener('change', e => {
    const t = e.target, n = t.name; if (!t.checked) return;
    const un = k => { if (f.elements[k]) f.elements[k].checked = false; };
    if (n === 'noHardware') { [...HWK, 'fitCustomHardwareEnabled'].forEach(un); document.getElementById('fitCustomHardwareWrap')?.classList.add('hidden'); }
    else if (HWK.includes(n) || n === 'fitCustomHardwareEnabled') un('noHardware');
    if (n === 'noRepair') { un('needsRepair'); document.getElementById('fitRepairWrap')?.classList.add('hidden'); }
    if (n === 'needsRepair') un('noRepair');
    if (n !== 'allComplete' && f.elements.allComplete?.checked) { f.elements.allComplete.checked = false; showCompleteIssues([]); toast('All Complete was unticked because the entry changed. Tick it again after checking.'); qcChanged(); }
  });
  const clr = e => { e.target.classList?.remove('inv', 'inv-box'); e.target.closest?.('.inv-box')?.classList.remove('inv-box'); };
  f.addEventListener('input', clr);
  f.addEventListener('change', clr);
  f.elements.qty?.addEventListener('input', () => { const fr = document.querySelector('#splits-fitting .split-qty'); if (fr && !fr.dataset.m) fr.value = f.elements.qty.value; ['sanding','polish','carpenter','fitting'].forEach(updateSplitSummary); updatePackSummary(); qcChanged(); });
  ['needsRepair', 'fitRepairReceiveDate'].forEach(n => f.elements[n]?.addEventListener('change', () => qcChanged()));
  f.addEventListener('input', e => { if (e.target.classList?.contains('split-done')) qcChanged(); });
  document.querySelectorAll('#repairPartsWrap .repair-part-issue').forEach(el => el.addEventListener('change', () => toggleRepairPartCustom(el)));
   let repIss = document.querySelector('[name=fitRepairIssue]');
  if(repIss) {
      let syncIss = () => document.getElementById('fitRepairIssueCustomWrap')?.classList.toggle('hidden', repIss.value !== 'Custom');
      repIss.addEventListener('change', syncIss); syncIss();
  }
  if (!workEditId) {
    const de = f.elements.date; if (de && !de.value) de.value = todayStr();
    const te = f.elements.targetDate, oe = f.elements.orderNo;
    if (te && oe) {
      te.addEventListener('input', () => { te.dataset.manual = te.value ? '1' : ''; });
      te.addEventListener('change', () => { te.dataset.manual = te.value ? '1' : ''; });
      const autoTarget = () => {
        if (te.dataset.manual === '1') return;
        const tae = normT(oe.value); let found = '';
        if (tae) {
          const m = getActiveDB().work.filter(w => normT(w.orderNo) === tae && w.targetDate)
            .sort((x, y) => String(y.date || '').localeCompare(String(x.date || '')))[0];
          if (m) found = m.targetDate;
        }
        if (found) { te.value = found; te.dataset.auto = '1'; te.classList.remove('inv', 'inv-box'); }
        else if (te.dataset.auto === '1') { te.value = ''; te.dataset.auto = ''; }
      };
      oe.addEventListener('input', autoTarget); oe.addEventListener('change', autoTarget); oe.addEventListener('blur', autoTarget);
      autoTarget();
    }
  }
  checkSubOrderDuplicate(false); checkItemCodeDuplicate(false); lhRefresh(); qcChanged();
  bindEntryShortcuts(f);
}


function bindEntryShortcuts(f) {
  if (!f || f.dataset.sc72) return; f.dataset.sc72 = '1';
  const unit = f.elements.sizeUnit; if (unit) { unit.tabIndex = -1; unit.dataset.skipEnter = '1'; }
  const cbm = f.elements.cbm;
  if (cbm) cbm.addEventListener('input', e => {
    let v = cbm.value.replace(/[^0-9.]/g, ''); const i = v.indexOf('.');
    if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, '');
    if (v !== cbm.value) cbm.value = v;
    if (!String(e.inputType || '').startsWith('delete') && /^\d*\.\d{2}$/.test(v)) {
      const n = f.elements.woodSupplier; if (n) { n.focus(); try { n.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} }
    }
  });
  const oe = f.elements.orderNo, be = f.elements.buyer;
  if (oe && be) {
    be.addEventListener('input', () => { be.dataset.auto = ''; be.dataset.skipEnter = ''; });
    const fill = () => {
      if (be.value.trim() && be.dataset.auto !== '1') return;
      const tae = normT(oe.value); let found = '';
      if (tae) {
        const A = getActiveDB();
        const w = A.work.filter(x => normT(x.orderNo) === tae && String(x.buyer || '').trim()).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))[0];
        if (w) found = w.buyer; else { const o = A.orders.find(x => normT(x.orderNo) === tae && String(x.buyer || '').trim()); if (o) found = o.buyer; }
      }
      if (found) { be.value = found; be.dataset.auto = '1'; be.dataset.skipEnter = '1'; be.classList.remove('inv', 'inv-box'); }
      else if (be.dataset.auto === '1') { be.value = ''; be.dataset.auto = ''; be.dataset.skipEnter = ''; }
    };
    ['input', 'change', 'blur'].forEach(ev => oe.addEventListener(ev, fill));
    if (!workEditId) fill();
  }
}

let wlLim = 50, olLim = 50, wlT = null, olT = null;
function wlDeb() { clearTimeout(wlT); wlT = setTimeout(wlRender, 150); }
function olDeb() { clearTimeout(olT); olT = setTimeout(olRender, 150); }
function wlResults() {
  const A = getActiveDB(), tae = normT(wl.tae), q = wl.q.trim().toLowerCase(), b = wl.buyer.trim().toLowerCase();
  if (!tae && !q && wl.st === 'all') return `<div class="empty">Enter a TAE number (or search text) to see entries.${b ? '<br>Buyer alone does not list entries.' : ''}</div>`;
  let list = sortedWork(A);
  if (b) list = list.filter(x => (x.buyer || '').toLowerCase().includes(b));
  if (tae) list = list.filter(x => ((x.orderNo || '') + ' ' + (x.subOrder || '')).toLowerCase().includes(tae));
  if (q) { const tm = q.split(/\s+/); list = list.filter(x => { const h = workHay(x); return tm.every(t => h.includes(t)); }); }
  if (wl.st === 'fitting') list = list.filter(x => splitsOf(x, 'fitting').length);
  if (wl.st === 'pending') list = list.filter(x => !statusOf(x).complete);
  if (wl.st === 'packed') list = list.filter(x => statusOf(x).complete);
  if (wl.st === 'fix') list = list.filter(x => fixSet(A).has(x.id));
  if (wl.st === 'fixnames') { const ids = fixNameIds(A); list = list.filter(x => ids.has(x.id)); }
  const tn = x => { const m = String(x.orderNo || '').match(/\d+/); return m ? Number(m[0]) : Infinity; };
  const sn = x => { const m = String(x.subOrder || '').trim().match(/\/(\d+)$/); return m ? Number(m[1]) : Infinity; };
  list = list.slice().sort((a, b) => (tn(a) - tn(b)) || String(a.orderNo || '').localeCompare(String(b.orderNo || '')) || (sn(a) - sn(b)) || String(a.subOrder || '').localeCompare(String(b.subOrder || ''), undefined, { numeric: true }));
  if (!list.length) return '<div class="empty">No production entries match.</div>';
  return `<div class="small muted" style="margin-bottom:8px">${list.length} entr${list.length === 1 ? 'y' : 'ies'}</div>` + list.slice(0, wlLim).map(x => workCard(x, { act: true })).join('') + (list.length > wlLim ? `<button class="btn" style="width:100%" onclick="wlLim+=50;wlRender()">Show more (${list.length - wlLim} left)</button>` : '');
}

function copyWork(idv) {
  const x = curDB().work.find(a => a.id === idv); if (!x) return;
  const c = JSON.parse(JSON.stringify(x));
  Object.assign(c, { subOrder: '', dupMark: '', date: '', workComplete: false, packingStatus: 'Pending', packingDate: '', packingSplits: [], needsRepair: false, qcV: 2 });
  QCK.forEach(k => c[k] = false);
  ['sanding', 'polish', 'carpenter', 'fitting'].forEach(k => (c[k + 'Splits'] || []).forEach(p => { p.done = 0; p.date = ''; }));
  editWork(null, c); toast('Cloned. Enter the new Sub Order and save.');
}

function editWork(idv, preset) {
  
  const x = preset || curDB().work.find(a => a.id === idv); if (!x) return;
  workEditId = preset ? null : idv; if (tab !== 'work') prevTab = tab; tab = 'work'; viewWorkId = null; render();
  const f = document.getElementById('workForm'); if (!f) return;
  const skip = ['packingStatus', 'needsRepair', 'fitCustomHardwareEnabled', ...HWK, ...QCK];
  Object.keys(x).forEach(k => { const el = f.elements[k]; if (el && !skip.includes(k) && typeof x[k] !== 'object') el.value = x[k] ?? ''; });
  if (f.elements.subOrder && x.dupMark) f.elements.subOrder.value = String(x.subOrder || '') + x.dupMark;
  [...HWK, ...QCK, 'fitCustomHardwareEnabled'].forEach(k => { if (f.elements[k]) f.elements[k].checked = !!x[k]; });
  if (x.workComplete && x.qcV !== 2) QC_ITEMS.forEach(([k]) => f.elements[k].checked = true);
  if (x.fitCustomHardwareEnabled) document.getElementById('fitCustomHardwareWrap')?.classList.remove('hidden');
  const pN = splitsOf(x, 'polish').map(s => s.name).filter(Boolean);
  ['sanding', 'polish', 'carpenter', 'fitting'].forEach(k => {
    const box = document.getElementById('splits-' + k), sp = splitsOf(x, k); if (!box) return;
    box.innerHTML = sp.length ? sp.map(r => splitRowHtml(k, r.name, r.qty, r.done, r.date, r.link, pN, r.supplier||'')).join('')
      : (k === 'fitting' ? splitRowHtml('fitting', 'Chandaram', x.qty, 0, '') : splitRowHtml(k, '', '', '0', '', '', pN));
  });
  if (f.elements.needsRepair) { f.elements.needsRepair.checked = !!x.needsRepair; if (x.needsRepair && f.elements.noRepair) f.elements.noRepair.checked = false; repSync(); syncRepairPartRows(repairPartsOf(x)); }
  const pkBox = document.getElementById('splits-packing'); if (pkBox) pkBox.innerHTML = (x.packingSplits || []).map(p => packRowHtml(p.name, p.qty, p.date)).join('');
  balToggle();
  bindWorkFormEvents(); ['sanding', 'polish', 'carpenter', 'fitting'].forEach(updateSplitSummary); updatePackSummary(); qcChanged();
  window.scrollTo(0, 0);
}

function editRepair(idv) { 
  
  let r = curDB().repairs.find(x => x.id === idv); if (!r) return; 
  let f = document.getElementById('repairForm'); 
  Object.keys(r).forEach(k => { if (f.elements[k]) f.elements[k].value = r[k] ?? ''; }); 
  if(r.issueType && !['Pc (Full Piece)','Door','Shelf','Leg','Iron Leg','Iron Drawer','Drawer','Hinge'].includes(r.issueType)) { f.elements.issueType.value = 'Custom'; if(f.elements.issueCustom) f.elements.issueCustom.value = r.issueType; }
  if (r.parts && f) { const box = f.querySelector('[name=issueType]')?.closest('.row'); if (box) { const first = r.parts[0] || {}; f.elements.issueType.value = ['Pc (Full Piece)','Door','Shelf','Leg','Iron Leg','Iron Drawer','Drawer','Hinge'].includes(first.part) ? first.part : 'Custom'; if(f.elements.issueCustom) f.elements.issueCustom.value = first.part || ''; } }
  f.scrollIntoView({ behavior: 'smooth' }); 
}

function roman(n) { return ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii','xviii','xix','xx'][n - 1] || String(n); }
function groupLines(lines) {
  const out = [];
  (lines || []).forEach(l => {
    const last = out[out.length - 1];
    if (last && last.sub === (l.sub || '') && last.itemCode === (l.itemCode || '')) last.rows.push(l);
    else out.push({ sub: l.sub || '', itemCode: l.itemCode || '', rows: [l] });
  });
  return out;
}

function printOrders(ids) {
  const A = getActiveDB(), e = esc;
  const list = ids.map(i => A.orders.find(o => o.id === i)).filter(Boolean);
  if (!list.length) return toast('Nothing to print.');
  const by = {}; list.forEach(o => { const k = (o.supplier || 'Supplier').trim(); (by[k] = by[k] || []).push(o); });
  const circ = n => n >= 1 && n <= 20 ? String.fromCharCode(0x2460 + n - 1) : '(' + n + ')';
  const dash = t => String(t || '').replace(/\//g, '-');
  const html = Object.entries(by).map(([sup, os]) => {
    const hd = [];
    os.forEach(o => {
      let cur = null, code = null;
      (o.lines || []).forEach(l => {
        const sub = cleanTae(l.sub) || o.orderNo || '';
        if (!cur || cur.key !== sub) { cur = { key: sub, buyer: o.buyer, items: [] }; hd.push(cur); code = null; }
        if (!cur.items.length || code !== l.itemCode) { cur.items.push({ code: l.itemCode, rows: [] }); code = l.itemCode; }
        cur.items[cur.items.length - 1].rows.push(l);
      });
    });
    const multi = hd.length > 1;
    const body = hd.map((h, i) => `<div class="nbg"><div class="nbh">${multi ? circ(i + 1) + ' ' : ''}${e(h.buyer || '')}&nbsp;&nbsp;${e(dash(h.key))}</div>` +
      h.items.map(it => `<div class="nbi">Item Code = ${e(it.code || '')}</div>` + it.rows.map((l, ri) => {
        const sz = l.size ? ` = ${e(l.size)}${l.unit === 'Cm' ? ' cm' : ''}` : '';
        const rm = l.remark ? ` &nbsp;⇒ ${e(l.remark)}` : '';
        const dm = Number(l.damaged) > 0 ? ` &nbsp;⇒ Damage (${e(l.damaged)} pc)` : '';
        const nm = it.rows.length > 1 ? '(' + roman(ri + 1) + ') ' : '';
        return `<div class="nbm">${nm}${e(l.material || '')}${sz} = ${e(l.qty)} pc${rm}${dm}</div>`;
      }).join('')).join('') + '<div class="nbs"></div></div>').join('');
    return `<div class="nb"><div class="nbt">${e(sup)}</div>${body}</div>`;
  }).join('');
  document.getElementById('printContainer').innerHTML = html;
  toast("In the print dialog, choose 'Save as PDF'."); setTimeout(() => printNamed(orderFileName(list)), 400);
}

var HAND_FONT = "'Patrick Hand','Kalam','Segoe Print','Bradley Hand','Comic Sans MS',cursive";
function safeName(s) { return String(s || '').replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim(); }
function orderFileName(list) {
  const u = a => [...new Set(a.filter(Boolean))];
  const sups = u(list.map(o => (o.supplier || '').trim())), taes = u(list.map(o => o.orderNo)), buy = u(list.map(o => (o.buyer || '').trim()));
  let n = (sups.length === 1 ? sups[0] : 'Orders') + ' - ' + taes.slice(0, 3).join(', ') + (taes.length > 3 ? ' +' + (taes.length - 3) : '');
  if (buy.length) n += ' (' + buy.join(', ') + ')';
  return safeName(n);
}
function printNamed(name) {
  const old = document.title; document.title = safeName(name);
  const back = () => { document.title = old; window.removeEventListener('afterprint', back); };
  window.addEventListener('afterprint', back); window.print();
}

async function renderOrderCanvas(list) {
  const S = 4, W = 1000, M = 50, LH = 58, FS = 38;
  try { await document.fonts.load(`${FS}px 'Patrick Hand'`); await document.fonts.ready; } catch (_) {}
  const mc = document.createElement('canvas').getContext('2d'); mc.font = `${FS}px ${HAND_FONT}`;
  const wrap = (txt, maxW) => { const out = []; let cur = ''; String(txt).split(' ').forEach(w => { const t = cur ? cur + ' ' + w : w; if (mc.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }); if (cur) out.push(cur); return out; };
  const circ = n => n >= 1 && n <= 20 ? String.fromCharCode(0x2460 + n - 1) : '(' + n + ')';
  const dash = t => String(t || '').replace(/\//g, '-');
  const by = {}; list.forEach(o => { const k = (o.supplier || 'Supplier').trim(); (by[k] = by[k] || []).push(o); });
  const ops = []; let y = M;
  Object.entries(by).forEach(([sup, os], si) => {
    if (si > 0) y += LH * 2;
    ops.push({ t: 'title', text: sup, y: y + 62 }); y += 62 + 40;
    const hd = [];
    os.forEach(o => { let cur = null, code = null;
      (o.lines || []).forEach(l => {
        const sub = cleanTae(l.sub) || o.orderNo || '';
        if (!cur || cur.key !== sub) { cur = { key: sub, buyer: o.buyer, items: [] }; hd.push(cur); code = null; }
        if (!cur.items.length || code !== l.itemCode) { cur.items.push({ code: l.itemCode, rows: [] }); code = l.itemCode; }
        cur.items[cur.items.length - 1].rows.push(l);
      }); });
    const multi = hd.length > 1;
    hd.forEach((h, i) => {
      ops.push({ t: 'head', text: (multi ? circ(i + 1) + '  ' : '') + (h.buyer || '') + '   ' + dash(h.key), x: M, y: y + LH }); y += LH;
      h.items.forEach(it => {
        ops.push({ t: 'text', text: 'Item Code = ' + (it.code || ''), x: M + 50, y: y + LH }); y += LH + 16;
        const rows = it.rows.map((l, ri) => ({ a: (it.rows.length > 1 ? '(' + roman(ri + 1) + ') ' : '') + (l.material || ''), b: l.size ? l.size + (l.unit === 'Cm' ? ' cm' : '') : '', c: l.qty + ' pc' + (l.remark ? '  ⇒ ' + l.remark : '') + (Number(l.damaged) > 0 ? '  ⇒ Damage (' + l.damaged + ' pc)' : '') }));
        const hasSize = rows.some(r => r.b), gap = 18, eq = mc.measureText('=').width;
        const w1 = Math.max(...rows.map(r => mc.measureText(r.a).width)), w2 = hasSize ? Math.max(...rows.map(r => mc.measureText(r.b).width)) : 0;
        rows.forEach(r => {
          const x1 = M + 24, xe1 = x1 + w1 + gap, x2 = xe1 + eq + gap, xe2 = x2 + w2 + gap, x3 = hasSize ? xe2 + eq + gap : x2;
          const endx = x3 + mc.measureText(r.c).width;
          if (endx <= W - M) { ops.push({ t: 'row', r, hasSize, x1, xe1, x2, xe2, x3, y: y + LH }); y += LH; }
          else { wrap([r.a, r.b, r.c].filter(Boolean).join(' = '), W - 2 * M - 24).forEach(line => { ops.push({ t: 'text', text: line, x: x1, y: y + LH }); y += LH; }); }
        });
        y += 26;
      });
      y += 18;
    });
  });
  const H = y + M;
  const cv = document.createElement('canvas'); cv.width = W * S; cv.height = Math.ceil(H * S);
  const c = cv.getContext('2d'); c.scale(S, S); OC.cvbg(c, W, H);
  OC.cvink(c); c.textBaseline = 'alphabetic';
  ops.forEach(o => {
    if (o.t === 'title') { c.font = `64px ${HAND_FONT}`; c.textAlign = 'center'; c.fillText(o.text, W / 2, o.y); const w = c.measureText(o.text).width; c.lineWidth = 3; c.beginPath(); c.moveTo(W / 2 - w / 2, o.y + 10); c.lineTo(W / 2 + w / 2, o.y + 10); c.stroke(); c.textAlign = 'left'; }
    else if (o.t === 'head') { c.font = `${FS + 6}px ${HAND_FONT}`; c.textAlign = 'left'; c.lineWidth = 1; c.fillText(o.text, o.x, o.y); c.strokeText(o.text, o.x, o.y); }
    else if (o.t === 'text') { c.font = `${FS}px ${HAND_FONT}`; c.textAlign = 'left'; c.fillText(o.text, o.x, o.y); }
    else if (o.t === 'row') {
      c.font = `${FS}px ${HAND_FONT}`; c.textAlign = 'left';
      c.fillText(o.r.a, o.x1, o.y); c.fillText('=', o.xe1, o.y);
      if (o.hasSize) { c.fillText(o.r.b, o.x2, o.y); c.fillText('=', o.xe2, o.y); }
      c.fillText(o.r.c, o.x3, o.y);
    }
  });
  return cv;
}

function getSeriesInfo(orderNo) {
  let match = String(orderNo || '').match(/\d+/);
  if(!match) return null;
  let num = parseInt(match[0]);
  if(num === 0) return null;
  
  let zeroIdx = num - 1;
  let h = Math.floor(zeroIdx / 100);
  let rem = zeroIdx % 100;
  let l = rem < 50 ? 'A' : 'B';
  let sName = h + l;
  let sStart = h * 100 + (l === 'A' ? 1 : 51);
  let sEnd = h * 100 + (l === 'A' ? 50 : 100);
  
  return { series: sName, num: num, start: sStart, end: sEnd };
}

    const info = getSeriesInfo(w.orderNo); if (!info) return;

}

const MERGE_SKIP = new Set(['work', 'orders', 'repairs', 'settings', 'profile', 'deleted', 'trash', 'lastBackup', 'epoch', 'pin']);
function addMissing(dst, src, depth, wins) {
  let n = 0; depth = depth || 0;
  const key = x => (x && typeof x === 'object' && x.id != null) ? 'id:' + x.id : JSON.stringify(x);
  const isObj = x => x && typeof x === 'object';
  if (Array.isArray(dst) && Array.isArray(src)) {
    const pos = new Map(); dst.forEach((x, i) => pos.set(key(x), i));
    src.forEach(x => {
      if (x == null) return; const k = key(x);
      if (!pos.has(k)) { dst.push(x); pos.set(k, dst.length - 1); n++; }
      else if (wins && isObj(x) && x.id != null) { const i = pos.get(k); if (JSON.stringify(dst[i]) !== JSON.stringify(x)) { dst[i] = x; n++; } }
    });
  } else if (isObj(dst) && isObj(src) && !Array.isArray(dst) && !Array.isArray(src) && depth < 8) {
    Object.keys(src).forEach(k => {
      if (dst[k] == null) { dst[k] = src[k]; n++; }
      else if (isObj(dst[k]) && isObj(src[k])) n += addMissing(dst[k], src[k], depth + 1, wins);
      else if (wins && !isObj(dst[k]) && !isObj(src[k]) && dst[k] !== src[k]) { dst[k] = src[k]; n++; }
    });
  }
  return n;
}

  let n = 0; srcMeta = srcMeta || {};
  Object.keys(srcMeta).forEach(k => {
    if (MERGE_SKIP.has(k)) return;

  });

}

<script>
const OV = { sec: 'overview', scope: 'run', open: '', sort: 'done' };

const ovP = (a, b) => b > 0 ? (a / b * 100).toFixed(1) + '%' : '0%';
const ovBar = (a, b) => `<div class="ov-bar"><i style="width:${b > 0 ? Math.min(100, a / b * 100) : 0}%"></i></div>`;

const OVD = { fns: [], cur: null, q: '', lim: 40 };
const ovReg = fn => { OVD.fns.push(fn); return OVD.fns.length - 1; };

const ovT = (h, rows, fns) => `<div class="ov-wrap"><table class="sd-tbl"><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>${rows.map((r, n) => `<tr${fns && fns[n] ? ` class="ov-click"${ovAttr(fns[n])}` : ''}>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const ovG = v => `<b style="color:var(--green2)">${v}</b>`, ovA = v => `<b style="color:var(--amber)">${v}</b>`;
function ovItemRow(i) {

    chip: `Order qty <b>${prQ(i.total)}</b> · Done ${ovG(prQ(i.done))} · Pending ${ovA(prQ(i.pend))} · CBM <b>${prC(i.cbm)}</b>` };
}
function ovPersonRow(r, name, label) {
  const t = r.i.total, c = t ? r.i.cbm * r.a / t : 0, pd = Math.max(r.a - r.d, 0), dt = String(r.sp.date || '').slice(0, 10);
  return { w: r.i.w, total: t, buyer: r.i.buyer, name, date: dt, num: { alloc: r.a, done: r.d, pend: pd, cbm: c },
    chip: `<b>${esc(name)}</b> (${esc(label)}) · Allocated <b>${prQ(r.a)}</b> of order total <b>${prQ(t)}</b> · Done ${ovG(prQ(r.d))} · Pending ${ovA(prQ(pd))} · CBM <b>${prC(c)}</b>${dt ? ' · ' + esc(dt) : ''}${r.sp.supplier ? ' · Supplier ' + esc(r.sp.supplier) : ''}` };
}
function ovDrill(i) {

  let d; try { d = fn(); } catch (e) { console.error(e); return toast('Could not open the details.'); }

  OVD.cur = d; OVD.q = ''; OVD.lim = 40;
  document.getElementById('ovModal')?.remove();
  document.body.insertAdjacentHTML('beforeend', `<div class="modal-backdrop" id="ovModal" onclick="if(event.target===this)ovClose()"><section class="card record-modal"><div class="section-title"><h3>${esc(d.title)}</h3><button class="btn smallbtn" onclick="ovClose()">✕ Close</button></div><p class="small muted" style="margin-top:-6px">Tap an entry to open its full record.</p><input class="search" id="ovQ" type="text" placeholder="Search TAE, sub order, item code, buyer, name..." oninput="OVD.q=this.value;OVD.lim=40;ovRender()"><div id="ovList"></div></section></div>`);
  ovRender();
}
function ovClose() { document.getElementById('ovModal')?.remove(); OVD.cur = null; try { refreshTerms(); } catch (e) {} }
function ovMore() { OVD.lim += 40; ovRender(); }
function ovRender() {

  if (terms.length) rows = rows.filter(r => terms.every(t => r.hay.includes(t)));

  const sn = x => { const m = String(x.subOrder || '').trim().match(/\/(\d+)$/); return m ? Number(m[1]) : Infinity; };

function ovItems(A) {
  return A.work.map(w => { const st = statusOf(w), total = Number(w.qty) || 0, pend = Math.min(total, Number(st.pend) || 0), done = total - pend, cbm = prNum(w.cbm);
    return { w, st, total, pend, done, cbm, cbmDone: total ? cbm * done / total : 0, tae: String(w.orderNo || '').trim() || 'No TAE', buyer: String(w.buyer || '').trim() || 'Not specified' }; });

function ovAgg(items) {

  items.forEach(i => { o.cbm += i.cbm; o.cbmDone += i.cbmDone; o.total += i.total; o.done += i.done; o.pend += i.pend; o.taes.add(i.tae);
    if (i.st.repairOpen) o.repair++; if (!i.st.complete && i.w.targetDate && String(i.w.targetDate).slice(0, 10) < td) o.overdue++;

    b.taes.add(i.tae); b.n++; b.cbm += i.cbm; b.cbmDone += i.cbmDone; b.total += i.total; b.done += i.done; b.pend += i.pend; o.buyers.set(i.buyer, b); });
  return o;
}
const ovLate = i => !i.st.complete && i.w.targetDate && String(i.w.targetDate).slice(0, 10) < todayStr();
const ovD = (items, title, f, sort) => () => ({ title, kind: 'item', sort, rows: items.filter(f || (() => true)).map(ovItemRow) });
function ovBuyerTbl(o, S) {
  const L = [...o.buyers.values()].sort((a, b) => b.cbm - a.cbm);
  return ovT(['Buyer', 'TAE', 'Items', 'CBM', '% of CBM', 'Total', 'Done', 'Pending', '% Done'], L.map(b => [esc(b.buyer), b.taes.size, b.n, prC(b.cbm), ovP(b.cbm, o.cbm), prQ(b.total), prQ(b.done), prQ(b.pend), ovP(b.done, b.total)]), L.map(b => ovD(S.items, 'Buyer · ' + b.buyer, i => i.buyer === b.buyer)));
}
function ovOverview(S) {
  const o = ovAgg(S.items), by = new Map(), I = S.items;
  I.forEach(i => { const x = by.get(i.tae) || []; x.push(i); by.set(i.tae, x); });
  const taes = [...by.entries()].map(([tae, it]) => { const a = ovAgg(it); return { tae, a, ncomp: it.filter(i => i.st.complete).length, n: it.length, buyers: [...a.buyers.keys()].join(', '), late: a.overdue }; }).sort((x, y) => y.a.pend - x.a.pend);
  const top = taes.slice(0, 60), G = 'var(--green2)';
  return ovK([['TAE Numbers', o.taes.size, '', ovD(I, 'All entries · by TAE')], ['Items', o.n, '', ovD(I, 'All Items')], ['Buyers', o.buyers.size, '', ovD(I, 'All entries · by Buyer', null, 'buyer')], ['Total CBM', prC(o.cbm), '', ovD(I, 'Total CBM · all entries', null, 'cbm')], ['Completed CBM', prC(o.cbmDone), G, ovD(I, 'Completed CBM · entries with completed pieces', i => i.done > 0, 'cbm')], ['CBM Done', ovP(o.cbmDone, o.cbm), '', ovD(I, 'CBM Done · all entries', null, 'cbm')], ['Total Qty', prQ(o.total), '', ovD(I, 'Total Qty · all entries')], ['Completed Qty', prQ(o.done), G, ovD(I, 'Completed Qty · entries with completed pieces', i => i.done > 0)], ['Pending Qty', prQ(o.pend), 'var(--amber)', ovD(I, 'Pending Qty · entries with pending pieces', i => i.pend > 0)], ['Qty Done', ovP(o.done, o.total), '', ovD(I, 'Qty Done · all entries')], ['In Repair', o.repair, '', ovD(I, 'In Repair', i => i.st.repairOpen)], ['Overdue Items', o.overdue, o.overdue ? 'var(--red)' : '', ovD(I, 'Overdue Items', ovLate)]]) + ovBar(o.done, o.total)
    + `<h4 style="margin:14px 0 4px">By Buyer</h4>` + ovBuyerTbl(o, S)
    + `<h4 style="margin:14px 0 4px">TAE Ranking (most pending first)</h4>` + ovT(['#', 'TAE', 'Buyer', 'Items', 'CBM', 'Total', 'Pending', '% Done', 'Late'], top.map((x, i) => [i + 1, esc(x.tae), esc(x.buyers), x.ncomp + '/' + x.n, prC(x.a.cbm), prQ(x.a.total), prQ(x.a.pend), ovP(x.a.done, x.a.total), x.late || '—']), top.map(x => ovD(I, 'TAE · ' + x.tae, i => i.tae === x.tae)));
}
function ovWho(i) { const nm = k => splitsOf(i.w, k).map(s => s.name).filter(Boolean).join(', '); return [i.w.woodSupplier && 'Supplier: ' + i.w.woodSupplier, nm('polish') && 'Polish: ' + nm('polish'), nm('sanding') && 'Sanding: ' + nm('sanding'), nm('carpenter') && 'Carpenter: ' + nm('carpenter')].filter(Boolean).map(esc).join(' · '); }
function ovWood(S) {
  const m = new Map(); S.items.forEach(i => { const k = String(i.w.woodSupplier || '').trim() || 'Not specified', x = m.get(k) || []; x.push(i); m.set(k, x); });
  const tot = ovAgg(S.items), list = [...m.entries()].map(([k, it]) => ({ k, it, a: ovAgg(it) })).sort((a, b) => b.a.cbm - a.a.cbm), I = S.items, G = 'var(--green2)';
  return ovK([['Suppliers', list.length, '', ovD(I, 'All entries · by Supplier')], ['Total CBM', prC(tot.cbm), '', ovD(I, 'Total CBM · all entries', null, 'cbm')], ['Completed CBM', prC(tot.cbmDone), G, ovD(I, 'Completed CBM · entries with completed pieces', i => i.done > 0, 'cbm')], ['Total Qty', prQ(tot.total), '', ovD(I, 'Total Qty · all entries')]])
    + list.map((x, r) => { const sup = i => (String(i.w.woodSupplier || '').trim() || 'Not specified') === x.k, T = 'Supplier · ' + x.k;
      return `<div class="item" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b><span class="ov-rank">${r + 1}</span>${esc(x.k)}</b><span class="muted small">${ovP(x.a.cbm, tot.cbm)} of total CBM</span></div>
      ${ovK([['CBM', prC(x.a.cbm), '', ovD(I, T + ' · CBM', sup, 'cbm')], ['Completed CBM', prC(x.a.cbmDone), G, ovD(I, T + ' · Completed CBM', i => sup(i) && i.done > 0, 'cbm')], ['Items', x.a.n, '', ovD(I, T + ' · Items', sup)], ['Total Qty', prQ(x.a.total), '', ovD(I, T + ' · Total Qty', sup)], ['Done Qty', prQ(x.a.done), '', ovD(I, T + ' · Done Qty', i => sup(i) && i.done > 0)], ['Pending Qty', prQ(x.a.pend), 'var(--amber)', ovD(I, T + ' · Pending Qty', i => sup(i) && i.pend > 0)]])}${ovBar(x.a.cbmDone, x.a.cbm)}

}
function ovPeople(items, type) {
  const m = new Map(), T = new Map(); items.forEach(i => T.set(i.tae, (T.get(i.tae) || 0) + i.total));

    exitArmed=true; try{toast('Press back again to exit');}catch(e){}
    setTimeout(()=>{exitArmed=false;},2000);
    try{history.pushState({d:0},'');}catch(e){}
  }
  function syncModals(){
    cleanAuth();
    ents.forEach(e=>{ if(e.t==='m'&&!e.dead&&!isOpen(e.el))e.dead=true; });
    openModals().forEach(m=>{
      if(m.__u||ents.some(e=>e.t==='m'&&e.el===m&&!e.dead))return;
      const te=ents[ents.length-1];
      if(te&&te.t==='m'&&te.dead){ te.el=m; te.dead=false; }
      else if(act){ ents.push({t:'m',el:m}); push(); }
      else m.__u=1;
    });
    let k=0; while(ents.length&&ents[ents.length-1].t==='m'&&ents[ents.length-1].dead){ents.pop();k++;}
    back(k);
  }
  new MutationObserver(syncModals).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});

  window.addEventListener('popstate',ev=>{
    if(ev.state&&ev.state.base){ if(expect>0){expect--;return;} ents.length=0; rootBack(); return; }
    const d=(ev.state&&typeof ev.state.d==='number')?ev.state.d:0;
    if(expect>0){ expect--; if(d===ents.length)return; }
    if(ents.length===0){ if(d>0)history.back(); return; }    
    if(d>=ents.length)return;
    const un=openModals().filter(m=>!ents.some(e=>e.t==='m'&&e.el===m));
    if(un.length){ un[un.length-1].remove(); expect++; try{history.go(ents.length-d);}catch(e){expect--;} return; }
    let acted=false;
    while(ents.length>d){
      const e=ents.pop();
      if(e.t==='m'){ if(isOpen(e.el)){ e.el.remove(); acted=true; } }
      else if(e.t==='a'){
        authStack.pop(); const ps=authStack[authStack.length-1]; acted=true;
        if(ps&&authOn()){ authQuiet=true; try{pendStop();}catch(_){} try{window.authShow(ps);}catch(_){} authQuiet=false; }
      }
      else if(pages.length>1){ pages.pop(); restore(pages[pages.length-1]); acted=true; }
    }
    if(!acted&&d>0)history.back();                            
  });

.taeCaps.shake{animation:taeShake .45s cubic-bezier(.36,.07,.19,.97) both}

const SEND_ICON=sendBtn?sendBtn.innerHTML:'➤';
const MIC_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z" fill="currentColor"/></svg>';
const STOP_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
const PH=input.placeholder||'Type or speak...';
let holdTimer=null,holdMode=false,swallowUntil=0;
function mode(){return input.value.trim()?'send':(TX.voice?'stop':'mic')}
function sync(){if(!sendBtn)return;const m=mode();if(sendBtn.dataset.m===m)return;sendBtn.dataset.m=m;sendBtn.innerHTML=m==='send'?SEND_ICON:(m==='mic'?MIC_ICON:STOP_ICON);sendBtn.classList.toggle('aiRec',m==='stop');sendBtn.setAttribute('aria-label','Send');sendBtn.title=m==='send'?'Send':(m==='mic'?'Tap or hold to speak':'Stop recording');}
/* UI is reset immediately: never wait for the browser's onend (Android Chrome often never fires it after stop()). */
function finishUi(){TX.rec=null;TX.voice=false;holdMode=false;input.placeholder=PH;waves.classList.remove('on');sync();}
function stopVoice(){const r=TX.rec;finishUi();if(!r)return;r.onend=null;r.onerror=null;try{r.stop()}catch(e){}setTimeout(()=>{try{r.abort()}catch(e){}r.onresult=null;},1500);}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Speech recognition is not supported in this browser. Try Chrome on HTTPS.');return;}
if(TX.voice||TX.rec){stopVoice();return;}
const rec=new SR();TX.rec=rec;TX.voice=true;rec.lang='hi-IN';rec.maxAlternatives=5;rec.continuous=true;rec.interimResults=true;waves.classList.add('on');sync();
rec.onresult=e=>{let fin='',interim='',alts=[];for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal){fin+=t;for(let a=1;a<e.results[i].length;a++)alts.push(e.results[i][a].transcript);}else interim+=t;}
if(interim&&!fin&&TX.rec===rec){input.placeholder='🎙 '+interim;}
if(fin){input.placeholder=TX.rec===rec?'🎙 …':PH;fin=fixSpeech(fin);TX.alts=alts.map(fixSpeech).filter(a=>a&&a!==fin);input.value=(input.value+' '+fin).trim();TX.altsFor=input.value.trim();input.dispatchEvent(new Event('input',{bubbles:true}));if(form.requestSubmit)form.requestSubmit();else form.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));}};
rec.onerror=e=>{const fatal=['not-allowed','service-not-allowed','audio-capture','network','language-not-supported'].includes(e.error);
if(e.error!=='no-speech'&&e.error!=='aborted'&&typeof say==='function')say(fatal&&e.error!=='network'?'Mic start nahi hua ('+e.error+'). Mic permission allow karo, aur page ko Chrome mein HTTPS par kholo (content:// ya file:// par mic block ho sakta hai).':'Voice input issue: '+e.error);
if(fatal)finishUi();};
rec.onend=()=>{if(TX.rec===rec)finishUi();};
try{rec.start()}catch(e){finishUi();}}
if(sendBtn){
sendBtn.addEventListener('pointerdown',()=>{if(TX.voice||input.value.trim())return;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{holdMode=true;swallowUntil=Date.now()+1e7;startVoice();},450);},true);
const rel=()=>{clearTimeout(holdTimer);if(holdMode){holdMode=false;swallowUntil=Date.now()+500;stopVoice();}};
sendBtn.addEventListener('pointerup',rel,true);sendBtn.addEventListener('pointercancel',rel,true);sendBtn.addEventListener('pointerleave',()=>{clearTimeout(holdTimer)},true);
sendBtn.addEventListener('click',e=>{if(Date.now()<swallowUntil){e.preventDefault();e.stopImmediatePropagation();return;}
if(input.value.trim()){if(TX.voice)stopVoice();return;}
e.preventDefault();e.stopImmediatePropagation();if(TX.voice)stopVoice();else startVoice();},true);
sendBtn.addEventListener('contextmenu',e=>e.preventDefault());}
/* typing by hand: stop the mic and show the Send button */
input.addEventListener('input',e=>{if(e.isTrusted&&TX.voice)stopVoice();sync();});setInterval(sync,300);sync();

}
const timer=setInterval(()=>{if($('taeForm')&&$('taeIn')){clearInterval(timer);setupControls();}},300);
window.THAR_AI_TX={state:TX};
})();
</script>
